openapi: 3.0.3
info:
  title: Ortho and Vision Care API
  version: 0.1.0-draft
  license:
    name: UNLICENSED
  description: |
    Machine-readable companion to `docs/design.md` (§5/§6) — the backend API
    surface for the multi-tenant eye-clinic records service. **Status: draft,
    for future implementation.** Nothing here is deployed yet; this is the
    contract the next implementation phase builds against, kept in sync with
    the design doc by hand (the design doc is still the narrative source of
    truth for *why*; this file is the precise, tool-consumable shape of
    *what*).

    ## Conventions used throughout

    - **Tenant scoping is implicit, never a parameter.** Every endpoint
      except `/platform/*` and `/auth/*` operates on the caller's own tenant,
      resolved server-side from the session cookie. There is deliberately no
      `tenantId` query param, path param, or request-body field anywhere in
      this spec — see design.md §4.1/§5.4/§10 for why a client-supplied
      tenant value is treated as a security bug, not a convenience.
    - **Auth is a session cookie**, not a bearer token — see the `cookieAuth`
      security scheme below. `POST /auth/login` and `POST /auth/accept-invite`
      are the only endpoints that don't require it already being set.
    - **Roles**: `super_user` (operates the service, no clinical access),
      `admin`/`doctor`/`front_desk` (all tenant-scoped clinic staff). Each
      operation's required role(s) are stated in its description and in the
      `x-required-roles` vendor extension (a plain array of role names, or
      `["public"]` for the two unauthenticated endpoints) for tooling that
      wants to assert on it programmatically — OpenAPI's native `security`
      keyword models *which scheme*, not *which role*, so this project layers
      role information on top the same way most role-gated APIs do.
    - **Pagination**: every endpoint that can grow unbounded returns
      `{ items: [...], totalCount }` via `page` (0-indexed, default 0) and
      `limit` (default 50) query params — never a bare array. The one
      deliberate exception is `GET /patient-groups`, a small admin-managed
      selector list not expected to need paging (design.md §6).
    - **Default sort order is a contract**, not incidental — every list
      endpoint's description states its fixed default; see design.md §5.2/§6.
    - **Error shape**: not specified in design.md beyond status codes, so this
      spec makes an explicit, conventional choice — `{ error: { code,
      message } }` — rather than leaving it unstated. Revisit if the real
      implementation needs something richer (field-level validation errors,
      say).
    - **`GET /patients/by-number/{patientNumber}` vs. `/patients/{id}/export`
      and `/patients/{id}/visits`**: a strict OpenAPI path-matching linter
      flags these as ambiguous, since `by-number`/`export`/`visits` could all
      syntactically occupy either a literal segment or a path parameter's
      position. This is intentionally left as-is rather than renamed — every
      real router this is likely to run on (Cloudflare Workers/Pages
      Functions included) resolves it the same way: literal path segments
      take precedence over parameterized ones, which is exactly the
      behavior these routes need.
servers:
  - url: /api
    description: >-
      Relative to wherever the API is deployed (Cloudflare Pages
      Functions/Workers alongside the client, design.md §3.3) — no fixed
      hostname yet.

tags:
  - name: Platform
    description: >-
      super_user-only — provisioning/revoking tenants and service-wide
      config. Operates across tenants by nature; every other tag's endpoints
      are scoped to one tenant.
  - name: Auth
    description: Login, logout, current-session lookup, and invite acceptance.
  - name: Preferences
    description: Per-user, per-device-independent settings (design.md §5.2).
  - name: Branding
    description: Per-tenant header title/subtitle/logo (design.md §5.5).
  - name: Prescription Template
    description: >-
      Per-tenant A4 print configuration for visit prescriptions — fixed
      layout, configurable content only (design.md §5.6).
  - name: Users
    description: Staff account management within a tenant (admin-only).
  - name: Patients
    description: Demographics and search — clinical detail lives under Visits.
  - name: Patient Groups
    description: Admin-managed free-form categories (e.g. "Friends", "Family").
  - name: Visits
    description: Eye examination records, including embedded refraction rows.
  - name: Attachments
    description: Prescription photos/scans attached to a visit — PHI, private storage.
  - name: Audit Log
    description: Who created/changed/deleted what, and when (admin-only).
  - name: Appointments
    description: Booking for existing or prospective patients.
  - name: Settings
    description: Per-tenant app settings (admin-only) — not to be confused with Platform's service-wide settings.

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------------
  # Platform (super_user)
  # ---------------------------------------------------------------------
  /platform/tenants:
    post:
      tags: [Platform]
      operationId: provisionTenant
      summary: Provision a tenant
      x-required-roles: [super_user]
      description: >-
        Creates the tenant, a default `app_settings` row, and an inactive
        first `admin` user with an invite token; sends the invite email
        out-of-band. `name`/`contactEmail`/`contactMobile` are all mandatory
        (design.md §5.4). The invite token is never present in the response
        — only delivered by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Platform]
      operationId: listTenants
      summary: List tenants across the whole service
      x-required-roles: [super_user]
      description: >-
        Excludes the reserved platform tenant (design.md §4.1). Default sort:
        `createdAt` desc.
      parameters:
        - $ref: '#/components/parameters/TenantStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated tenant list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /platform/tenants/{id}:
    patch:
      tags: [Platform]
      operationId: updateTenantStatus
      summary: Suspend or reactivate a tenant
      x-required-roles: [super_user]
      description: >-
        Updates `status` (`active`/`suspended`). Suspending deletes that
        tenant's live `sessions` rows in the same transaction and takes
        effect on the very next request from any of its users, not just
        future logins (design.md §5.4/§10). Reactivating only flips the
        status flag back; it does not restore the killed sessions.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantStatusUpdateRequest'
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform/settings:
    get:
      tags: [Platform]
      operationId: getPlatformSettings
      summary: Read service-wide configuration
      x-required-roles: [super_user]
      description: >-
        Distinct from the per-tenant `GET /settings` below. Exact fields are
        genuinely unspecified beyond a placeholder shape (design.md §5.4/§13)
        — `PlatformSettings` below is intentionally close to empty.
      responses:
        '200':
          description: Service-wide settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Platform]
      operationId: updatePlatformSettings
      summary: Update service-wide configuration
      x-required-roles: [super_user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingsUpdateRequest'
      responses:
        '200':
          description: Updated service-wide settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  /auth/accept-invite:
    post:
      tags: [Auth]
      operationId: acceptInvite
      summary: Accept a provisioning invite and set a password
      x-required-roles: [public]
      security: []
      description: >-
        Public endpoint — the token comes from the emailed invite link, not
        a session. Sets the password, activates the user, clears the invite
        fields, and signs them in (sets the session cookie) in one step
        (design.md §5.4/§6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invite accepted; session cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Invalid, expired, or already-used token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and set a session cookie
      x-required-roles: [public]
      security: []
      description: >-
        Resolves both the user *and* their tenant from `email` — globally
        unique across all tenants (design.md §5.4) — no separate
        tenant-selection step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: httpOnly, Secure, SameSite=Strict session cookie (design.md §3.3/§10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Wrong email/password, inactive account, or suspended tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current session
      x-required-roles: [any, super_user]
      responses:
        '204':
          description: Session invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user, role, and tenant branding
      x-required-roles: [any, super_user]
      description: >-
        Bundles `branding` (design.md §5.5) into the response so the client
        can render the header from this one call instead of a second
        round-trip on every app load.
      responses:
        '200':
          description: Current session's user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # Preferences
  # ---------------------------------------------------------------------
  /me/preferences:
    get:
      tags: [Preferences]
      operationId: getMyPreferences
      summary: Current user's own theme + list page size
      x-required-roles: [any]
      description: Not gated by role — every account manages its own (design.md §5.2).
      responses:
        '200':
          description: Current preferences (defaults applied if never set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Preferences]
      operationId: updateMyPreferences
      summary: Update either/both preference fields
      x-required-roles: [any]
      description: Creates the row on first write if it doesn't exist yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdateRequest'
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # Branding
  # ---------------------------------------------------------------------
  /branding:
    patch:
      tags: [Branding]
      operationId: updateBranding
      summary: Update title/subtitle
      x-required-roles: [admin]
      description: >-
        Creates the `tenant_branding` row on first write if it doesn't exist
        yet, same lazy-create pattern as `PATCH /me/preferences` (design.md
        §5.5). Logo upload/removal are separate endpoints below since it's a
        file, not a JSON field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingUpdateRequest'
      responses:
        '200':
          description: Updated branding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBranding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /branding/logo:
    post:
      tags: [Branding]
      operationId: uploadBrandingLogo
      summary: Upload a logo
      x-required-roles: [admin]
      description: >-
        Multipart upload to a **public** R2 bucket, distinct from
        attachments' private one (design.md §5.5/§10) — a clinic's logo has
        no confidentiality requirement, so the response URL is a plain,
        long-cacheable one rather than a short-lived signed URL. The client
        compresses the image before upload, reusing the same
        `browser-image-compression` approach used for prescription photos
        but tuned smaller (§7).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated branding with the new logo URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBranding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Branding]
      operationId: deleteBrandingLogo
      summary: Remove the logo
      x-required-roles: [admin]
      description: Header falls back to title/subtitle text only (design.md §5.5).
      responses:
        '200':
          description: Updated branding with no logo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBranding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------
  # Prescription Template
  # ---------------------------------------------------------------------
  /prescription-template:
    get:
      tags: [Prescription Template]
      operationId: getPrescriptionTemplate
      summary: The tenant's print configuration
      x-required-roles: [any]
      description: >-
        Defaulted (`showLetterhead: true`, `topMarginMm: 0`, `footerNote:
        null`) if the tenant has never saved one. Open to any role since
        it's needed to render the print view for everyone, same reasoning
        as `GET /branding` (design.md §5.6).
      responses:
        '200':
          description: Current print configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Prescription Template]
      operationId: updatePrescriptionTemplate
      summary: Update the tenant's print configuration
      x-required-roles: [admin]
      description: >-
        Creates the `prescription_templates` row on first write if it
        doesn't exist yet, same lazy-create pattern as `PATCH /branding`
        (design.md §5.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionTemplateUpdateRequest'
      responses:
        '200':
          description: Updated print configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List staff accounts (own tenant only)
      x-required-roles: [admin]
      description: Default sort — `fullName` asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated staff list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a staff account
      x-required-roles: [admin, super_user]
      description: >-
        `admin` creates `doctor`/`front_desk`/`admin` under their own
        tenant. A `super_user` may additionally set `role: super_user` on a
        new account under the reserved platform tenant (design.md
        §4.1/§5.4) — no other caller may ever set that role; the API
        rejects a non-`super_user` request body containing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Staff account created (inactive with an invite token, same flow as tenant provisioning).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update role/active status
      x-required-roles: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Patients
  # ---------------------------------------------------------------------
  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List/search patients
      x-required-roles: [any]
      description: >-
        `search` matches **name** (substring, case-insensitive) **or**
        `patientNumber` (substring — a partial number or date prefix like
        `P-20260705` also works) — ≥3 characters or omitted, shorter values
        → `400` (design.md §5.2). Optional `groupId` filters to one group.
        Optional `sort` overrides the default: `group` (group name asc, then
        `createdAt` desc within a group), `name_asc`/`name_desc` — omit for
        the plain default. Summary rows only; full clinical detail lives on
        the visit endpoints. Default sort: `createdAt` desc
        (newest-registered first).
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 3
        - name: groupId
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [group, name_asc, name_desc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated patient summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Create a patient (demographics only)
      x-required-roles: [admin, doctor, front_desk]
      description: >-
        Request body may not include clinical fields. Response includes the
        generated `patientNumber` (design.md §5.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Patient created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /patients/{id}:
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Patient detail
      x-required-roles: [any]
      description: >-
        Demographics, including group; visit history fetched separately via
        `GET /patients/{id}/visits`.
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Patient detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Update demographics
      x-required-roles: [admin, doctor, front_desk]
      description: >-
        Including reassigning `groupId` — any role that can edit
        demographics, not restricted to `admin` (design.md §4).
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdateRequest'
      responses:
        '200':
          description: Updated patient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Patients]
      operationId: deletePatient
      summary: Soft-delete a patient
      x-required-roles: [admin]
      description: Cascades to visits/attachments; noted in the audit log.
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '204':
          description: Patient soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /patients/by-number/{patientNumber}:
    get:
      tags: [Patients]
      operationId: getPatientByNumber
      summary: Exact-match lookup by patient_number
      x-required-roles: [any]
      description: >-
        Convenience alias for already having the full ID (e.g. a barcode/QR
        scan) — skips the substring search. Resolves to the same shape as
        `GET /patients/{id}`.
      parameters:
        - name: patientNumber
          in: path
          required: true
          schema:
            type: string
            example: P-20260705-0007
      responses:
        '200':
          description: Patient detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /patients/{id}/export:
    get:
      tags: [Patients]
      operationId: exportPatient
      summary: Full patient data export
      x-required-roles: [admin]
      description: Data portability (design.md §10) — JSON or PDF.
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - name: format
          in: query
          schema:
            type: string
            enum: [json, pdf]
            default: json
      responses:
        '200':
          description: Full export of everything the schema holds for this patient.
          content:
            application/json:
              schema:
                type: object
                description: Shape TBD — everything design.md §5 holds for this patient, nested.
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Patient Groups
  # ---------------------------------------------------------------------
  /patient-groups:
    get:
      tags: [Patient Groups]
      operationId: listPatientGroups
      summary: List active (non-deleted) patient groups
      x-required-roles: [any]
      description: >-
        For the group selector in patient forms and the filter dropdown.
        **Not paginated** — a small, admin-managed selector list, not
        expected to need paging (design.md §6). Default sort: `name` asc.
      responses:
        '200':
          description: All active groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Patient Groups]
      operationId: createPatientGroup
      summary: Create a group
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientGroupWriteRequest'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /patient-groups/{id}:
    patch:
      tags: [Patient Groups]
      operationId: renamePatientGroup
      summary: Rename a group
      x-required-roles: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientGroupWriteRequest'
      responses:
        '200':
          description: Renamed group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Patient Groups]
      operationId: deletePatientGroup
      summary: Soft-delete a group
      x-required-roles: [admin]
      description: >-
        Existing patients keep their `groupId`/name for history; the group
        drops out of future assignment/filter lists.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Visits
  # ---------------------------------------------------------------------
  /patients/{id}/visits:
    get:
      tags: [Visits]
      operationId: listPatientVisits
      summary: Visit history for a patient
      x-required-roles: [admin, doctor, front_desk]
      description: Default sort — `visitAt` desc (most recent visit first).
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated visit history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Visits]
      operationId: createVisit
      summary: Create a visit
      x-required-roles: [admin, doctor, front_desk]
      description: >-
        One payload containing a `visitAt` datetime, up to 4 refraction rows
        (distance/reading × left/right), diagnosis, treatment plan, and
        lenses (design.md §5.2).
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitWriteRequest'
      responses:
        '201':
          description: Visit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EyeVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /visits/{id}:
    get:
      tags: [Visits]
      operationId: getVisit
      summary: Single visit detail
      x-required-roles: [admin, doctor, front_desk]
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '200':
          description: Visit detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EyeVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Visits]
      operationId: updateVisit
      summary: Update a visit
      x-required-roles: [admin, doctor, front_desk]
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitWriteRequest'
      responses:
        '200':
          description: Updated visit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EyeVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Visits]
      operationId: deleteVisit
      summary: Delete a visit
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '204':
          description: Visit deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /visits/{id}/print:
    post:
      tags: [Visits]
      operationId: logPrescriptionPrint
      summary: Log a prescription print
      x-required-roles: [admin, doctor, front_desk]
      description: >-
        Writes an audit_log row only (`action: export`, `entityType:
        eye_visit`, design.md §5.6/§10) — the prescription itself is
        rendered entirely client-side from data already fetched (the visit,
        the patient, tenant branding, and the prescription template), so
        there's nothing for this endpoint to return beyond confirming the
        audit entry was written.
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '204':
          description: Print logged.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Attachments
  # ---------------------------------------------------------------------
  /visits/{id}/attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a prescription photo/scan
      x-required-roles: [admin, doctor]
      description: >-
        Multipart upload to a **private** R2 bucket (PHI — distinct from the
        public bucket branding logos use, design.md §5.5/§10). Hidden
        entirely (not just disabled) for `front_desk` (design.md §4/§8.4).
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attachments/{id}:
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Fetch an attachment
      x-required-roles: [admin, doctor]
      description: >-
        Redirects (`302`) to a short-lived signed R2 URL rather than
        streaming the bytes itself (design.md §6).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to a short-lived signed R2 URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Remove an attachment
      x-required-roles: [admin]
      description: >-
        Deletion of an already-saved attachment is admin-only, same
        restriction as deleting a visit (design.md §4).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Attachment removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Audit Log
  # ---------------------------------------------------------------------
  /audit-log:
    get:
      tags: [Audit Log]
      operationId: listAuditLog
      summary: Audit trail lookup
      x-required-roles: [admin]
      description: >-
        `search` matches `actorName` or `entityLabel` (≥3 chars, same rule as
        `/patients`, design.md §5.2). `entityType`/`actorUserId` filter to
        one value each; `from`/`to` filter to a date range (either or both,
        inclusive). Default sort: `createdAt` desc (most recent activity
        first, not user-configurable).
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 3
        - name: entityType
          in: query
          schema:
            type: string
        - name: actorUserId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated audit log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------
  # Appointments
  # ---------------------------------------------------------------------
  /appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List/search appointments
      x-required-roles: [any]
      description: >-
        `search` matches the resolved patient name (linked patient's name,
        or the prospective `name` — ≥3 chars, same rule as `/patients`).
        `from`/`to` filter to a date range (either or both, inclusive).
        `sort` overrides the default `date`,`time` asc (soonest first):
        `name_asc`/`name_desc`.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 3
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated appointment list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment
      x-required-roles: [any]
      description: >-
        Either `patientId` (existing patient) or `name`/`dob`/`manualAge`/
        `mobile`/`address` (prospective patient), plus `date` (required) and
        `time` (optional). `date` must be today or later — a past date is
        rejected with `400` (design.md §8.11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentWriteRequest'
      responses:
        '201':
          description: Appointment booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /appointments/{id}:
    patch:
      tags: [Appointments]
      operationId: updateAppointment
      summary: Update an appointment
      x-required-roles: [any]
      description: >-
        Used both for the Edit action and to set `patientId` once a
        prospective patient is registered via "Add patient" (design.md
        §8.11).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentWriteRequest'
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Appointments]
      operationId: deleteAppointment
      summary: Delete a single appointment
      x-required-roles: [any]
      description: >-
        Not admin-only, unlike `DELETE /visits/{id}` — the client's "bulk
        delete" is just this endpoint called once per selected id (design.md
        §8.11).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Appointment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # Settings (per-tenant)
  # ---------------------------------------------------------------------
  /settings:
    get:
      tags: [Settings]
      operationId: getAppSettings
      summary: Per-tenant app settings
      x-required-roles: [admin]
      description: Auto-delete toggle + day threshold (design.md §5.2).
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Settings]
      operationId: updateAppSettings
      summary: Update either/both settings fields
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSettingsUpdateRequest'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >-
        httpOnly, Secure, SameSite=Strict session cookie (design.md §3.3/§10)
        backed by the `sessions` table. Not a bearer token — there is no
        Authorization header in this API.

  parameters:
    Page:
      name: page
      in: query
      description: 0-indexed page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        default: 50
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
    VisitId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TenantStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TenantStatus'

  responses:
    BadRequest:
      description: Validation error (e.g. a search query under 3 characters, a past appointment date).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No/invalid/expired session, or the tenant was suspended after the session was created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the session's role doesn't permit this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such resource — including a resource that exists but belongs to a
        different tenant, which is deliberately indistinguishable from it
        not existing at all (design.md §10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: search must be at least 3 characters

    Role:
      type: string
      enum: [super_user, admin, doctor, front_desk]
    Gender:
      type: string
      enum: [female, male, other, unspecified]
    Eye:
      type: string
      enum: [left, right]
    VisionType:
      type: string
      enum: [distance, reading]
    TenantStatus:
      type: string
      enum: [active, suspended]
    AuditAction:
      type: string
      enum: [create, update, delete, export]
    Theme:
      type: string
      enum: [light, dark, auto]

    # -- Platform / tenants -------------------------------------------------
    Tenant:
      type: object
      required: [id, name, contactEmail, contactMobile, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        contactEmail:
          type: string
          format: email
        contactMobile:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      required: [name, contactEmail, contactMobile]
      properties:
        name:
          type: string
        contactEmail:
          type: string
          format: email
        contactMobile:
          type: string
    TenantStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TenantStatus'
    TenantListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        totalCount:
          type: integer

    PlatformSettings:
      type: object
      description: >-
        Intentionally close to empty — exact fields are unspecified beyond
        "service specific configurations, etc." (design.md §5.4/§13). Add
        real properties here as concrete needs come up.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
    PlatformSettingsUpdateRequest:
      type: object
      description: Placeholder — no fields defined yet.

    # -- Auth / current user -------------------------------------------------
    CurrentUser:
      type: object
      required: [id, email, fullName, role, tenantId, tenantName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        tenantId:
          type: string
        tenantName:
          type: string
        branding:
          $ref: '#/components/schemas/TenantBranding'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password

    # -- Preferences ----------------------------------------------------------
    Preferences:
      type: object
      required: [theme, listPageSize]
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        listPageSize:
          type: integer
          nullable: true
          description: 'null = use the client''s own default (20), design.md §5.2/§7.'
    PreferencesUpdateRequest:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        listPageSize:
          type: integer
          nullable: true

    # -- Branding -------------------------------------------------------------
    TenantBranding:
      type: object
      properties:
        title:
          type: string
          nullable: true
          description: Falls back to Tenant.name when null (design.md §5.5).
        subtitle:
          type: string
          nullable: true
          description: Free text, e.g. doctor name(s).
        logoUrl:
          type: string
          format: uri
          nullable: true
          description: Public, long-cacheable URL — not a signed one (design.md §5.5/§10).
        updatedAt:
          type: string
          format: date-time
    BrandingUpdateRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        subtitle:
          type: string
          nullable: true

    # -- Prescription template -----------------------------------------------
    PrescriptionTemplate:
      type: object
      required: [showLetterhead, topMarginMm, updatedAt]
      properties:
        showLetterhead:
          type: boolean
          description: >-
            If false, the print view's header area is left blank instead of
            rendering the tenant's branding — for clinics using pre-printed
            letterhead stationery (design.md §5.6).
        topMarginMm:
          type: integer
          description: Extra blank space reserved at the page top, mainly meaningful alongside showLetterhead=false.
        footerNote:
          type: string
          nullable: true
          description: Free text printed at the bottom of every prescription from this tenant.
        updatedAt:
          type: string
          format: date-time
    PrescriptionTemplateUpdateRequest:
      type: object
      properties:
        showLetterhead:
          type: boolean
        topMarginMm:
          type: integer
        footerNote:
          type: string
          nullable: true

    # -- Users ------------------------------------------------------------
    User:
      type: object
      required: [id, tenantId, email, fullName, role, active, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
          description: >-
            Also doubles as "invite not yet accepted" (false) for a
            freshly-provisioned account (design.md §5.4).
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    UserCreateRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    UserUpdateRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
    UserListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        totalCount:
          type: integer

    # -- Patients ---------------------------------------------------------
    PatientSummary:
      type: object
      required: [id, patientNumber, name, gender]
      properties:
        id:
          type: string
        patientNumber:
          type: string
          example: P-20260705-0007
        name:
          type: string
        age:
          type: integer
          nullable: true
          description: Computed at read time (design.md §5.2) — never a stored/derived column.
        gender:
          $ref: '#/components/schemas/Gender'
        groupId:
          type: string
          nullable: true
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientSummary'
        - type: object
          properties:
            dob:
              type: string
              format: date
              nullable: true
            manualAge:
              type: integer
              nullable: true
              description: >-
                Only meaningful alongside a dob as a deliberate override of
                the computed age (design.md §5.2).
            address:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    PatientCreateRequest:
      type: object
      required: [name, gender]
      properties:
        name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        manualAge:
          type: integer
          nullable: true
        address:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        groupId:
          type: string
          nullable: true
    PatientUpdateRequest:
      $ref: '#/components/schemas/PatientCreateRequest'
    PatientListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientSummary'
        totalCount:
          type: integer

    # -- Patient groups -----------------------------------------------------
    PatientGroup:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientGroupWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # -- Visits / refractions ------------------------------------------------
    EyeRefraction:
      type: object
      required: [eye, visionType]
      properties:
        eye:
          $ref: '#/components/schemas/Eye'
        visionType:
          $ref: '#/components/schemas/VisionType'
        sphere:
          type: number
          format: float
          nullable: true
          description: Diopters, signed (e.g. -0.25).
        cylinder:
          type: number
          format: float
          nullable: true
        axis:
          type: integer
          minimum: 0
          maximum: 180
          nullable: true
        visualAcuity:
          type: string
          nullable: true
          example: '6/6'
    EyeVisit:
      type: object
      required: [id, patientId, visitAt, refractions, createdAt, updatedAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        visitAt:
          type: string
          format: date-time
        examinerId:
          type: string
          nullable: true
        refractions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/EyeRefraction'
        diagnosis:
          type: string
          nullable: true
        treatmentPlan:
          type: string
          nullable: true
        lenses:
          type: string
          nullable: true
        followUpDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VisitWriteRequest:
      type: object
      required: [visitAt]
      properties:
        visitAt:
          type: string
          format: date-time
        refractions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/EyeRefraction'
        diagnosis:
          type: string
          nullable: true
        treatmentPlan:
          type: string
          nullable: true
        lenses:
          type: string
          nullable: true
        followUpDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
    VisitListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EyeVisit'
        totalCount:
          type: integer

    # -- Attachments --------------------------------------------------------
    Attachment:
      type: object
      required: [id, visitId, fileName, contentType, sizeBytes, createdAt]
      properties:
        id:
          type: string
        visitId:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time

    # -- Audit log ------------------------------------------------------------
    AuditLogEntry:
      type: object
      required: [id, actorName, action, entityType, entityId, entityLabel, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
          nullable: true
        actorName:
          type: string
          description: Snapshotted at write time (design.md §5.2), not resolved via a live join.
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
          example: patient
        entityId:
          type: string
        entityLabel:
          type: string
          description: Snapshotted at write time (design.md §5.2) — e.g. a patient's name.
        beforeJson:
          type: string
          nullable: true
          description: JSON-encoded snapshot of the row before the change; unset for create.
        afterJson:
          type: string
          nullable: true
          description: JSON-encoded snapshot of the row after the change; unset for delete.
        createdAt:
          type: string
          format: date-time
    AuditLogListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        totalCount:
          type: integer

    # -- Appointments -------------------------------------------------------
    Appointment:
      type: object
      required: [id, date, createdAt, updatedAt]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
          nullable: true
          example: '14:30'
        patientId:
          type: string
          nullable: true
          description: null = prospective patient (design.md §5.2).
        name:
          type: string
          nullable: true
          description: Prospective-patient name; only meaningful while patientId is null.
        dob:
          type: string
          format: date
          nullable: true
        manualAge:
          type: integer
          nullable: true
        mobile:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppointmentWriteRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          nullable: true
        patientId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        dob:
          type: string
          format: date
          nullable: true
        manualAge:
          type: integer
          nullable: true
        mobile:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    AppointmentListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        totalCount:
          type: integer

    # -- Settings (per-tenant) -----------------------------------------------
    AppSettings:
      type: object
      required: [autoDeleteOldAppointments, autoDeleteAfterDays, updatedAt]
      properties:
        autoDeleteOldAppointments:
          type: boolean
        autoDeleteAfterDays:
          type: integer
        updatedAt:
          type: string
          format: date-time
    AppSettingsUpdateRequest:
      type: object
      properties:
        autoDeleteOldAppointments:
          type: boolean
        autoDeleteAfterDays:
          type: integer
